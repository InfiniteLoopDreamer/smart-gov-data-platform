name: smart-gov

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smart-gov-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      # 持久化 SQLite / CSV；首次无数据时入口脚本会自动 generate_data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smart-gov-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    depends_on:
      backend:
        condition: service_healthy
